<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>文档 · 薄肌计划</title>
<meta name="theme-color" content="#1C7553">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="薄肌计划">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one phone-width reading column; sticky header with a back link; markdown rendered into .doc */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --fg:#15201B; --muted:#5B6A63; --line:#D9E1DC;
  --accent:#1C7553; --accent-fg:#FFFFFF; --accent-soft:#E0F0E8; --warn:#9A5D0B; --warn-soft:#FAEFD9;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#161F1B; --fg:#E2EBE6; --muted:#90A199; --line:#28342F;
  --accent:#4FC394; --accent-fg:#06140E; --accent-soft:#183026; --warn:#E2A748; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#161F1B; --fg:#E2EBE6; --muted:#90A199; --line:#28342F;
  --accent:#4FC394; --accent-fg:#06140E; --accent-soft:#183026; --warn:#E2A748; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(72px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px}
.top h1{margin:0;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.top .all{margin-left:auto}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg)}
.card h3{margin:0;font-size:16px}
.card .go{color:var(--accent);font-size:13px;font-weight:600}
.list{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.state{padding:28px 0;color:var(--muted)}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0}
.toc summary{font-weight:700;cursor:pointer}
.toc ul{margin:8px 0 2px;padding-left:0;list-style:none;font-size:14px;line-height:1.5}
.toc li{margin:5px 0}
.toc a{text-decoration:none}
.doc{overflow-wrap:anywhere}
.doc h1{font-size:22px;line-height:1.35;margin:18px 0 6px}
.doc h2{font-size:18px;line-height:1.4;margin:30px 0 8px;padding-top:16px;border-top:1px solid var(--line);scroll-margin-top:64px}
.doc h3{font-size:16px;line-height:1.45;margin:22px 0 6px;scroll-margin-top:64px}
.doc h4{font-size:15px;margin:16px 0 4px;scroll-margin-top:64px}
.doc p{margin:8px 0}
.doc ul,.doc ol{margin:8px 0;padding-left:22px}
.doc li{margin:5px 0}
.doc li > p{margin:0}
.doc li > p + p{margin-top:6px}
.doc li > ul,.doc li > ol{margin:4px 0}
.doc b{font-weight:700}
.doc blockquote{margin:12px 0;padding:8px 12px;background:var(--warn-soft);color:var(--fg);border-radius:10px;font-size:14px}
.doc blockquote p{margin:0}
.doc .tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.55}
.doc th,.doc td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;text-align:left;min-width:4.5em}
.doc thead th{border-top:0;background:var(--bg);font-size:12.5px;color:var(--muted);font-weight:600}
.doc pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13px;white-space:pre-wrap;margin:10px 0}
.doc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.doc a{font-weight:600;text-decoration:none}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.more{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:14px}
.more a{font-weight:600;text-decoration:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:8px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html" id="back">← 返回</a>
    <h1 id="title">文档</h1>
    <a href="docs.html" class="all" id="all" hidden>全部文档</a>
  </header>
  <main id="main"><p class="state">正在打开…</p></main>
</div>
<button type="button" class="fab" id="fab" hidden>目录</button>

<script>
(function(){
// 每份文档的源文件在 docs/ 下，和私仓里 app/docs/ 是同一份 Markdown
const DOCS = [
  {id:'xing', file:'docs/性能力.md', title:'性能力', back:'index.html#energy',
   sub:'原理和自测、盆底肌（收紧、放松、耐力）、心肺和血管、兴奋度觉察、单人停-动和挤压、呼吸和心态、和伴侣的实战技巧、辅助和药物、12 周计划'},
  {id:'tui', file:'docs/腿臀核心.md', title:'腿、臀、核心', back:'index.html#train',
   sub:'每个动作怎么做到位、核心的四个方向、髋活动度、爆发力、第 9 周起的升级版和自测'},
  {id:'jian', file:'docs/宽肩.md', title:'宽肩', back:'index.html#train',
   sub:'三角肌中束、后束、背阔肌、圆肩和腰围：怎么练、怎么推进、怎么看效果'}
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unesc = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');

/* ---------- a small Markdown renderer: headings, paragraphs, nested lists, tables, quotes, code ---------- */
const LIST_RE = /^( *)([-*+]|\d{1,3}[.)])[ \t]+(.*)$/;
const lead = l => l.match(/^ */)[0].length;
const CJK = /[⺀-鿿豈-﫿＀-￯]/;
function joinLines(arr){ return arr.reduce((a, b) => a + (CJK.test(a.slice(-1)) && CJK.test(b[0] || '') ? '' : ' ') + b); }
function mapHref(u){
  const raw = unesc(u);
  const m = raw.match(/^(?:\.\/)?([^/?#]+\.md)(#.*)?$/);
  if (m){ const d = DOCS.find(x => x.file === 'docs/'+m[1]); return d ? {href:'docs.html?d='+d.id+(m[2] || ''), ext:false} : null; }
  if (/^https?:\/\//.test(raw)) return {href:raw, ext:true};
  if (raw[0] === '#' || /^(index|pose|docs)\.html/.test(raw)) return {href:raw, ext:false};
  return null; // 私仓里的其他文件，网页上没有，只显示文字
}
function linkHtml(text, u){
  const h = mapHref(u);
  if (!h) return text;
  return '<a href="'+esc(h.href)+'"'+(h.ext ? ' target="_blank" rel="noopener"' : '')+'>'+text+'</a>';
}
function inline(s){
  let o = esc(s);
  o = o.replace(/`([^`]+)`/g, '<code>$1</code>');
  o = o.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  o = o.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => linkHtml(t, u));
  o = o.replace(/&lt;(https?:\/\/[^\s<>]+?)&gt;/g, (m, u) => linkHtml(u, u));
  return o;
}
const isTableAt = (lines, i) => /^ *\|/.test(lines[i]) && i + 1 < lines.length && /^ *\|? *:?-{3,}/.test(lines[i+1]);
function isBlockStart(lines, i){
  const l = lines[i];
  return /^#{1,4} /.test(l) || /^ *```/.test(l) || /^ *(-{3,}|\*{3,}|_{3,}) *$/.test(l) || /^ *>/.test(l) || LIST_RE.test(l) || isTableAt(lines, i);
}
function cells(row){ let s = row.trim(); if (s[0] === '|') s = s.slice(1); if (s.slice(-1) === '|') s = s.slice(0, -1); return s.split('|').map(c => c.trim()); }
function table(rows){
  const head = cells(rows[0]), body = rows.slice(2).map(cells);
  return '<div class="tablewrap"><table><thead><tr>'+head.map(c => '<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
    body.map(r => '<tr>'+head.map((_, k) => '<td>'+inline(r[k] || '')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function list(lines, i, ctx){
  const m0 = lines[i].match(LIST_RE), base = m0[1].length, ordered = /\d/.test(m0[2]);
  const startNo = ordered ? parseInt(m0[2], 10) : 1, items = [];
  while (i < lines.length){
    if (!lines[i].trim()){
      let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
      const mj = j < lines.length && lines[j].match(LIST_RE);
      if (mj && mj[1].length === base && /\d/.test(mj[2]) === ordered){ i = j; continue; }
      break;
    }
    const m = lines[i].match(LIST_RE);
    if (!m || m[1].length !== base || /\d/.test(m[2]) !== ordered) break;
    const cIndent = base + m[2].length + 1, buf = [m[3]];
    i++;
    while (i < lines.length){
      const l = lines[i];
      if (!l.trim()){
        let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && lead(lines[j]) > base){ buf.push(''); i++; continue; }
        break;
      }
      const ld = lead(l);
      if (ld > base){ buf.push(l.slice(Math.min(ld, cIndent))); i++; continue; }
      break;
    }
    items.push(buf);
  }
  const tag = ordered ? 'ol' : 'ul';
  const html = (ordered && startNo !== 1 ? '<ol start="'+startNo+'">' : '<'+tag+'>') +
    items.map(b => '<li>'+(b.slice(1).some(x => x.trim()) ? blocks(b, ctx) : inline(b[0]))+'</li>').join('') + '</'+tag+'>';
  return {html, next:i};
}
function slug(text, used){
  const s = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\p{M}\s_-]/gu, '').replace(/\s/g, '-');
  let out = s || 'h', n = 1;
  while (used.has(out)) out = s + '-' + (n++);
  used.add(out); return out;
}
function blocks(lines, ctx){
  let html = '', i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (!line.trim()){ i++; continue; }
    if (/^ *```/.test(line)){
      const buf = []; i++;
      while (i < lines.length && !/^ *```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; html += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    const hm = line.match(/^(#{1,4}) +(.+?) *#* *$/);
    if (hm){
      const lv = hm[1].length, inner = inline(hm[2]), text = unesc(inner.replace(/<[^>]+>/g, ''));
      const id = slug(text, ctx.used);
      if (lv === 2) ctx.toc.push({id, text});
      if (lv === 1 && !ctx.title) ctx.title = text;
      html += '<h'+lv+' id="'+esc(id)+'">'+inner+'</h'+lv+'>'; i++; continue;
    }
    if (/^ *(-{3,}|\*{3,}|_{3,}) *$/.test(line)){ html += '<hr>'; i++; continue; }
    if (isTableAt(lines, i)){
      const rows = []; while (i < lines.length && /^ *\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      html += table(rows); continue;
    }
    if (/^ *>/.test(line)){
      const buf = []; while (i < lines.length && /^ *>/.test(lines[i])){ buf.push(lines[i].replace(/^ *> ?/, '')); i++; }
      html += '<blockquote>'+blocks(buf, ctx)+'</blockquote>'; continue;
    }
    if (LIST_RE.test(line)){ const r = list(lines, i, ctx); html += r.html; i = r.next; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && (buf.length === 0 || !isBlockStart(lines, i))){ buf.push(lines[i].trim()); i++; }
    html += '<p>'+inline(joinLines(buf))+'</p>';
  }
  return html;
}
function render(md){
  const ctx = {used:new Set(), toc:[], title:''};
  const html = blocks(md.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n'), ctx);
  return {html, toc:ctx.toc, title:ctx.title};
}

/* ---------- pages ---------- */
function showIndex(){
  document.title = '文档 · 薄肌计划';
  $('#main').innerHTML = '<div class="list">'+
    '<p class="small muted">对着练的详细做法。打开过一次之后，断网也能看。</p>'+
    DOCS.map(d => '<a class="card" href="docs.html?d='+d.id+'"><h3>'+esc(d.title)+'</h3><span class="small muted">'+esc(d.sub)+'</span><span class="go">打开 →</span></a>').join('')+
    '</div>';
}
const posKey = id => 'boji:docpos:'+id;
function savePos(id){ try { localStorage.setItem(posKey(id), String(Math.round(window.scrollY))); } catch(e){} }
function readPos(id){ try { return Number(localStorage.getItem(posKey(id))) || 0; } catch(e){ return 0; } }
function jumpToHash(){
  if (!location.hash) return false;
  let id = location.hash.slice(1);
  try { id = decodeURIComponent(id); } catch(e){}
  const el = document.getElementById(id);
  if (!el) return false;
  el.scrollIntoView();
  return true;
}
async function showDoc(d){
  $('#back').href = d.back;
  $('#all').hidden = false;
  $('#title').textContent = d.title;
  let md;
  try {
    const res = await fetch(d.file);
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch(e){
    $('#main').innerHTML = '<p class="state">没打开：现在没网，而且这份文档之前没打开过。联网后打开一次，之后断网也能看。</p>';
    return;
  }
  const r = render(md);
  document.title = (r.title || d.title)+' · 薄肌计划';
  const toc = r.toc.length ? '<details class="toc" id="toc" open><summary>目录</summary><ul>'+r.toc.map(t => '<li><a href="#'+esc(t.id)+'">'+esc(t.text)+'</a></li>').join('')+'</ul></details>' : '';
  const others = DOCS.filter(x => x.id !== d.id).map(x => '<a href="docs.html?d='+x.id+'">'+esc(x.title)+' →</a>').join('');
  $('#main').innerHTML = '<article class="doc">'+r.html.replace(/(<\/h1>[\s\S]*?)(<h2|$)/, (m, a, b) => a + toc + b)+'</article>'+
    '<div class="more"><span class="muted small">其他文档</span>'+others+'<a href="'+esc(d.back)+'">← 回到打卡页面</a></div>';
  const fab = $('#fab');
  if (toc){
    fab.hidden = false;
    fab.addEventListener('click', () => { const t = $('#toc'); t.open = true; t.scrollIntoView({block:'start'}); window.scrollBy(0, -70); });
  }
  if (!jumpToHash()){ const y = readPos(d.id); if (y) window.scrollTo(0, y); }
  let t = null;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => savePos(d.id), 400); }, {passive:true});
  window.addEventListener('pagehide', () => savePos(d.id));
  window.addEventListener('hashchange', jumpToHash);
}

const doc = DOCS.find(x => x.id === new URLSearchParams(location.search).get('d'));
if (doc) showDoc(doc); else showIndex();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
